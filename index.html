<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .calculadora {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
            width: 320px;
        }

        .pantalla {
            background: #222;
            color: #0f0;
            font-size: 2.5em;
            padding: 20px;
            border-radius: 10px;
            text-align: right;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: flex-end;
            word-wrap: break-word;
            word-break: break-all;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px;
            font-size: 1.5em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            background: #f0f0f0;
            color: #333;
        }

        button:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .operador {
            background: #667eea;
            color: white;
        }

        .operador:hover {
            background: #5568d3;
        }

        .igual {
            background: #48bb78;
            color: white;
            grid-column: span 2;
        }

        .igual:hover {
            background: #38a169;
        }

        .limpiar {
            background: #f56565;
            color: white;
            grid-column: span 2;
        }

        .limpiar:hover {
            background: #e53e3e;
        }

        .cero {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculadora">
        <div class="pantalla" id="pantalla">0</div>
        <div class="botones">
            <button class="limpiar" onclick="limpiar()">C</button>
            <button class="operador" onclick="deleteLast()">DEL</button>
            <button class="operador" onclick="agregarOperador('/')">÷</button>
            
            <button onclick="agregarNumero('7')">7</button>
            <button onclick="agregarNumero('8')">8</button>
            <button onclick="agregarNumero('9')">9</button>
            <button class="operador" onclick="agregarOperador('*')">×</button>
            
            <button onclick="agregarNumero('4')">4</button>
            <button onclick="agregarNumero('5')">5</button>
            <button onclick="agregarNumero('6')">6</button>
            <button class="operador" onclick="agregarOperador('-')">−</button>
            
            <button onclick="agregarNumero('1')">1</button>
            <button onclick="agregarNumero('2')">2</button>
            <button onclick="agregarNumero('3')">3</button>
            <button class="operador" onclick="agregarOperador('+')">+</button>
            
            <button class="cero" onclick="agregarNumero('0')">0</button>
            <button onclick="agregarNumero('.')">.</button>
            <button class="igual" onclick="calcular()">=</button>
        </div>
    </div>

    <script>
        let pantalla = document.getElementById('pantalla');
        let operacion = '';
        let numeroAnterior = '';
        let numeroActual = '';
        let operador = '';

        function agregarNumero(num) {
            if (num === '.' && numeroActual.includes('.')) return;
            numeroActual += num;
            actualizarPantalla();
        }

        function agregarOperador(op) {
            if (numeroActual === '') return;
            if (numeroAnterior !== '') {
                calcular();
            }
            operador = op;
            numeroAnterior = numeroActual;
            numeroActual = '';
        }

        function calcular() {
            if (numeroAnterior === '' || numeroActual === '' || operador === '') return;

            let resultado;
            const num1 = parseFloat(numeroAnterior);
            const num2 = parseFloat(numeroActual);

            switch (operador) {
                case '+':
                    resultado = num1 + num2;
                    break;
                case '-':
                    resultado = num1 - num2;
                    break;
                case '*':
                    resultado = num1 * num2;
                    break;
                case '/':
                    resultado = num2 !== 0 ? num1 / num2 : 'Error';
                    break;
                default:
                    return;
            }

            numeroActual = resultado.toString();
            operador = '';
            numeroAnterior = '';
            actualizarPantalla();
        }

        function limpiar() {
            numeroActual = '';
            numeroAnterior = '';
            operador = '';
            actualizarPantalla();
        }

        function deleteLast() {
            numeroActual = numeroActual.toString().slice(0, -1);
            actualizarPantalla();
        }

        function actualizarPantalla() {
            pantalla.textContent = numeroActual || '0';
        }
    </script>
</body>
</html>
